name: Verify maintained application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node, browser, and release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:check
          npx prettier --check .github/workflows/verify.yml

      - name: Test application
        run: npm test

      - name: Build browser and source packages
        run: npm run build

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Install test browsers and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test Chromium, Firefox, and WebKit
        run: npm run test:ui -- --workers=2 --reporter=line,html

      - name: Check release integrity
        run: npm run release:check

      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload verified packages
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-packages-${{ github.sha }}
          path: |
            releases/*.zip
            releases/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
